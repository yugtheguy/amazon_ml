# C002 Pair Dataset V1 — Configuration

# ---------------------------------------------------------------------------
# Experiment Identity
# ---------------------------------------------------------------------------
experiment_id: "C002"
parent_experiment: "C001"
schema_version: "v1"
candidate_pool_version: "C001_R001_v1"

# ---------------------------------------------------------------------------
# Input Paths  (override on Kaggle)
# ---------------------------------------------------------------------------
# C001 final shard directory (contains India_shard_*.parquet, US_shard_*.parquet)
candidate_pool_dir: "artifacts/candidate_pool/C001/candidate_pool_v1/final"

# Official ground truth — NEVER substitute another source
ground_truth_path: "data/raw/train/train_ground_truth.tsv"

# Frozen fold manifest — SHA256 verified
fold_manifest_path: "artifacts/folds/folds_v1.parquet"
