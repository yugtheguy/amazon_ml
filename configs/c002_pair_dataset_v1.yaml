# Processed S1 — for country attachment
# Optional: if absent, country will be null
processed_s1_path: ""   # fill in e.g. /kaggle/input/.../train_source1.parquet

# ---------------------------------------------------------------------------
# Output Path
# ---------------------------------------------------------------------------
output_dir: "artifacts/datasets/C002/pair_dataset_v1"

# ---------------------------------------------------------------------------
# Processing
# ---------------------------------------------------------------------------
include_diagnostics: true   # Attach Category C diagnostic columns

# Shard chunk_size: not used in C002 (shard boundaries come from C001)
# C002 processes one C001 shard at a time, no re-chunking.
